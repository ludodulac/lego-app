[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickhouse-ai"
version = "0.1.0"
description = "Core contracts for BrickHouse AI"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
brickhouse-m0 = "brickhouse.pipeline:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["brickhouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

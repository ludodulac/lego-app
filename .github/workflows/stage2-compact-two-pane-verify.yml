name: Stage 2 compact two-pane consolidate
on: [push]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev]'
      - name: Apply proven 43337 product change
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/brickhouse/bricks/planned_opening_parts.py')
          s=p.read_text()
          s=s.replace(
              '"""Use at most three real transparent panels per pane, preferring 3-brick panels."""',
              '"""Partition height into 3-brick panels and 2-brick slots; 2-brick slots use two clear 1-brick panels."""',
          )
          old='''        for panel_height in heights:\n            part_id = "PANEL_1X4X3_60581" if panel_height == 3 else "PANEL_1X4X2_8012"\n            x, y, z, rotation = _to_global(facade, raster.x_studs + pane_x, 4, raster.z_bricks + z_offset, front, depth)\n            placements.append(WindowPartPlacement(part_id=part_id, category="window_pane", facade=facade, x_studs=x, y_studs=y, z_plates=z, rotation_quarter_turns=rotation, opening_id=raster.id))\n            z_offset += panel_height\n'''
          new='''        for panel_height in heights:\n            if panel_height == 3:\n                x, y, z, rotation = _to_global(facade, raster.x_studs + pane_x, 4, raster.z_bricks + z_offset, front, depth)\n                placements.append(WindowPartPlacement(part_id="PANEL_1X4X3_60581", category="window_pane", facade=facade, x_studs=x, y_studs=y, z_plates=z, rotation_quarter_turns=rotation, opening_id=raster.id))\n            else:\n                for one_high in range(2):\n                    x, y, z, rotation = _to_global(facade, raster.x_studs + pane_x, 4, raster.z_bricks + z_offset + one_high, front, depth)\n                    placements.append(WindowPartPlacement(part_id="PANEL_1X4X1_43337", category="window_pane", facade=facade, x_studs=x, y_studs=y, z_plates=z, rotation_quarter_turns=rotation, opening_id=raster.id))\n            z_offset += panel_height\n'''
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('backend/brickhouse/bricks/piece_capabilities.py')
          s=p.read_text()
          old='window_ids.update({"PANEL_1X4X3_60581", "PANEL_1X4X2_8012"})'
          assert old in s
          p.write_text(s.replace(old,'window_ids.update({"PANEL_1X4X3_60581", "PANEL_1X4X2_8012", "PANEL_1X4X1_43337"})'))

          p=Path('backend/brickhouse/bricks/opening_representation_plan.py')
          s=p.read_text()
          old='_COMPACT_TWO_PANE_ASSEMBLY_ID = "compact-two-pane-60581-8012"'
          assert old in s
          p.write_text(s.replace(old,'_COMPACT_TWO_PANE_ASSEMBLY_ID = "compact-two-pane-60581-43337"'))
          PY
      - name: Lock exact compact BOM test
        run: |
          cat > tests/bricks/test_compact_two_pane_panels.py <<'PY'
          import json
          from collections import Counter
          from brickhouse.scene import ArchitecturalScene, project_scene_to_building
          from brickhouse.pipeline import run_m0_pipeline_model

          IDS=("obs-front-opening-top-left","obs-front-opening-top-right","obs-front-opening-middle-left","obs-front-opening-middle-right")
          TOP=IDS[:2]
          MID=IDS[2:]

          def _micro_building():
              source=ArchitecturalScene.model_validate(json.load(open("tests/fixtures/real_house_scene_pane_count_stage2.json",encoding="utf-8")))
              volume=next(v for v in source.volumes if v.id=="volume_main")
              openings=[next(o for o in source.openings if o.id==oid) for oid in IDS]
              micro=source.model_copy(update={"volumes":[volume],"openings":openings,"roofs":[],"terrain":None,"chimneys":[],"platforms":[],"stairs":[],"equipment":[],"visibility":[],"relations":[],"platform_structure_observations":[],"wall_profile_observations":[],"stair_system_links":[]})
              projected=project_scene_to_building(micro)
              assert projected.building is not None and not projected.blocked
              return projected.building

          def test_real_two_pane_windows_use_clear_compact_panel_family():
              bundle=run_m0_pipeline_model(_micro_building(),front_width_studs=48)
              bom={}
              for oid in IDS:
                  parts=[p for p in bundle.brick_model.parts if p.opening_id==oid]
                  bom[oid]=Counter(p.part_id for p in parts)
              for oid in TOP:
                  assert bom[oid] == Counter({"PANEL_1X4X3_60581":6,"BRICK_1X1":9})
              for oid in MID:
                  assert bom[oid] == Counter({"PANEL_1X4X3_60581":4,"PANEL_1X4X1_43337":4,"BRICK_1X1":8})
              assert all("PANEL_1X4X2_8012" not in bom[oid] for oid in IDS)

          def test_exact_compact_reservations_do_not_move_real_rasters():
              from brickhouse.geometry import generate_building_geometry
              from brickhouse.bricks import generate_building_brick_shell, build_opening_representation_plan, apply_opening_representation_plan
              building=_micro_building()
              shell=generate_building_brick_shell(generate_building_geometry(building),48)
              before={r.id:(r.x_studs,r.z_bricks,r.width_studs,r.height_bricks) for w in shell.walls for r in w.grid.openings if r.id in IDS}
              plan=build_opening_representation_plan(building,shell)
              result=apply_opening_representation_plan(building,shell,plan)
              after={r.id:(r.x_studs,r.z_bricks,r.width_studs,r.height_bricks) for w in result.shell.walls for r in w.grid.openings if r.id in IDS}
              assert not result.rejections
              assert before == after
              assert all(not a.geometry_changed for a in result.anchors if a.opening_id in IDS)
              reservations={x.opening_id:x for x in plan.openings if x.opening_id in IDS}
              assert all(x.status=="reserved" for x in reservations.values())
              assert all(x.motif_id=="compact_two_pane:transparent_panels" for x in reservations.values())
              assert all(x.assembly_id=="compact-two-pane-60581-43337" for x in reservations.values())
          PY
      - name: Verify consolidated slice
        run: pytest -q tests/bricks/test_compact_two_pane_panels.py tests/scene/test_opening_pane_count_fidelity.py tests/scene/test_survey_scene_pane_contract.py
      - name: Commit consolidated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/brickhouse/bricks/planned_opening_parts.py backend/brickhouse/bricks/piece_capabilities.py backend/brickhouse/bricks/opening_representation_plan.py tests/bricks/test_compact_two_pane_panels.py
          git diff --cached --check
          git commit -m "Use clear 43337 panels for compact 9x8 glazing"
          git push origin HEAD:stage2-two-pane-visual-refinement

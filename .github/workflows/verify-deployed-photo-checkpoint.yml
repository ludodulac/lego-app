name: Verify deployed photo checkpoint

on:
  workflow_run:
    workflows: ["Deploy viewer to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-photo-checkpoint:
    name: Verify deployed photo cockpit
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Verify returning browser resets to fresh five-photo benchmark and stays responsive
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGE_URL: https://ludodulac.github.io/lego-app/
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import time
          from urllib.parse import urljoin
          from urllib.request import urlopen

          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          deploy_sha = os.environ['DEPLOY_SHA']
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the checkpoint runner')

          benchmark_url = urljoin(
              base if base.endswith('/') else base + '/',
              f'photo.html?benchmark=real-house-5&checkpoint=bh231&runtime-check={deploy_sha}',
          )
          survey_url = urljoin(
              base if base.endswith('/') else base + '/',
              'benchmarks/real-house-5/accepted-survey-v0.1.json',
          )
          with urlopen(survey_url, timeout=30) as response:
              accepted_survey = json.load(response)
          stale_pending = {
              'survey': accepted_survey,
              'issues': [],
              'valid_for_scene_fusion': True,
          }

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=browser_path,
                  args=['--no-sandbox'],
              )
              context = browser.new_context(viewport={'width': 390, 'height': 844}, accept_downloads=True)
              context.add_init_script(
                  script=f"""
                  (() => {{
                    if (location.pathname.endsWith('/photo.html')) {{
                      localStorage.setItem('brickhouse.pendingArchitecturalSurvey', {json.dumps(json.dumps(stale_pending))});
                      localStorage.setItem('brickhouse.knownFrontWidthM', '12.34');
                      localStorage.setItem('brickhouse.lastRejectedArchitecturalScene', '{{"stale":true}}');
                      localStorage.setItem('brickhouse.lastSceneValidationError', 'stale');
                    }}
                  }})();
                  """
              )
              page = context.new_page()
              runtime_errors = []
              failed_requests = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))
              page.on('requestfailed', lambda request: failed_requests.append(
                  f'{request.method} {request.url}: {request.failure}'
              ))

              started = time.perf_counter()
              response = page.goto(benchmark_url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, f'photo.html HTTP failure: {response.status if response else "no response"}'
              page.wait_for_selector('body.boldungo-shell-enabled', timeout=15000)
              page.wait_for_function(
                  """() => document.querySelectorAll('.selected-photo-preview').length === 5""",
                  timeout=15000,
              )
              usable_ms = round((time.perf_counter() - started) * 1000)

              assert page.locator('.selected-photo-preview').count() == 5
              assert page.locator('#shell-state-title').text_content().strip() == '1. Photos'
              assert page.locator('.boldungo-cockpit').get_attribute('data-shell-state') == 'photos'
              assert page.locator('#shell-primary-button').text_content().strip() == 'Créer le PDF'
              assert page.locator('#photo-persistence-note').count() == 1
              assert page.evaluate("localStorage.getItem('brickhouse.pendingArchitecturalSurvey')") is None
              assert page.evaluate("localStorage.getItem('brickhouse.knownFrontWidthM')") is None
              assert page.evaluate("localStorage.getItem('brickhouse.lastRejectedArchitecturalScene')") is None
              assert page.evaluate("localStorage.getItem('brickhouse.lastSceneValidationError')") is None
              assert page.evaluate('1 + 1') == 2
              assert not runtime_errors, runtime_errors
              assert not failed_requests, failed_requests

              page.locator('[data-shell-state="survey"]').click(timeout=5000)
              assert page.locator('.boldungo-cockpit').get_attribute('data-shell-state') == 'survey'
              page.locator('[data-shell-state="photos"]').click(timeout=5000)
              assert page.locator('.boldungo-cockpit').get_attribute('data-shell-state') == 'photos'

              with page.expect_download(timeout=30000) as download_info:
                  page.locator('#shell-primary-button').click(timeout=5000)
              download = download_info.value
              assert download.suggested_filename == 'BRICKHOUSE-SURVEY-pdf-handoff-0.10.pdf', download.suggested_filename
              page.wait_for_function(
                  """() => document.querySelector('#ai-package-status')?.textContent?.includes('brickhouse-survey-result.json')""",
                  timeout=15000,
              )
              failure = download.failure()
              assert failure is None, failure
              assert not runtime_errors, runtime_errors
              assert not failed_requests, failed_requests

              metrics = page.evaluate("""() => {
                const entries = performance.getEntriesByType('resource');
                const scripts = entries.filter(entry => entry.initiatorType === 'script');
                return {
                  resources: entries.length,
                  scripts: scripts.length,
                  transfer_bytes: Math.round(entries.reduce((sum, entry) => sum + (entry.transferSize || 0), 0)),
                  script_transfer_bytes: Math.round(scripts.reduce((sum, entry) => sum + (entry.transferSize || 0), 0)),
                  dom_content_loaded_ms: Math.round(performance.getEntriesByType('navigation')[0]?.domContentLoadedEventEnd || 0),
                };
              }""")
              metrics['five_photo_usable_ms'] = usable_ms
              metrics['pdf_filename'] = download.suggested_filename
              print('BH-231 deployed returning-browser benchmark metrics:', json.dumps(metrics, sort_keys=True))
              context.close()
              browser.close()

          print(f'deployed photo cockpit returning-browser verification passed: {benchmark_url}')
          PY

name: Verify deployed photo checkpoint

on:
  workflow_run:
    workflows: ["Deploy viewer to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-photo-checkpoint:
    name: Verify deployed photo cockpit
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Verify fresh benchmark and restored Survey paths
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGE_URL: https://ludodulac.github.io/lego-app/
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import time
          from urllib.parse import urljoin

          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          deploy_sha = os.environ['DEPLOY_SHA']
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the checkpoint runner')

          survey = {
              'schema_version': '0.1',
              'id': 'bh227-deployed-checkpoint-survey',
              'name': 'BH-227 deployed checkpoint',
              'canonical_frame': {
                  'front_facade': 'front',
                  'x_direction': 'front_view_left_to_right',
                  'y_direction': 'front_to_rear',
                  'z_direction': 'bottom_to_top',
              },
              'photos': [{
                  'photo_index': 1,
                  'capture_role': 'facade_view',
                  'facade': 'front',
                  'description': 'Contract-only deployed UI fixture.',
                  'source': {'kind': 'observed', 'confidence': 1.0},
                  'image_left_maps_to_facade_offset': 'low',
                  'user_note': None,
              }],
              'known_measurements': [],
              'observations': [],
              'relations': [],
              'representation_policy': {
                  'preserve_nominal_materials': True,
                  'preserve_opening_composition': True,
                  'preserve_architectural_details': True,
                  'reproduce_weathering': False,
                  'reproduce_temporary_objects': False,
              },
              'notes': 'Synthetic UI-state fixture only.',
          }
          stored = json.dumps({'survey': survey, 'issues': [], 'valid_for_scene_fusion': True}, ensure_ascii=False)
          init_script = f"localStorage.setItem('brickhouse.pendingArchitecturalSurvey', {json.dumps(stored)});"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=browser_path,
                  args=['--no-sandbox'],
              )

              # Fresh benchmark: prove the actual five-photo entry point is usable,
              # has thumbnails, and does not throw blocking browser/network errors.
              fresh = browser.new_context(viewport={'width': 390, 'height': 844})
              page = fresh.new_page()
              runtime_errors = []
              failed_requests = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))
              page.on('requestfailed', lambda request: failed_requests.append(
                  f'{request.method} {request.url}: {request.failure}'
              ))
              benchmark_url = urljoin(
                  base if base.endswith('/') else base + '/',
                  f'photo.html?benchmark=real-house-5&checkpoint=bh230&runtime-check={deploy_sha}',
              )
              started = time.perf_counter()
              response = page.goto(benchmark_url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, f'photo.html HTTP failure: {response.status if response else "no response"}'
              page.wait_for_selector('body.boldungo-shell-enabled', timeout=15000)
              page.wait_for_function(
                  """() => document.querySelectorAll('.selected-photo-preview').length === 5""",
                  timeout=15000,
              )
              usable_ms = round((time.perf_counter() - started) * 1000)
              assert page.locator('.selected-photo-preview').count() == 5
              assert page.locator('#shell-state-title').text_content().strip() == '1. Photos'
              assert page.locator('#shell-primary-button').text_content().strip() == 'Créer le PDF'
              assert page.locator('#photo-persistence-note').count() == 1
              assert not runtime_errors, runtime_errors
              assert not failed_requests, failed_requests
              metrics = page.evaluate("""() => {
                const entries = performance.getEntriesByType('resource');
                const scripts = entries.filter(entry => entry.initiatorType === 'script');
                return {
                  resources: entries.length,
                  scripts: scripts.length,
                  transfer_bytes: Math.round(entries.reduce((sum, entry) => sum + (entry.transferSize || 0), 0)),
                  script_transfer_bytes: Math.round(scripts.reduce((sum, entry) => sum + (entry.transferSize || 0), 0)),
                  dom_content_loaded_ms: Math.round(performance.getEntriesByType('navigation')[0]?.domContentLoadedEventEnd || 0),
                };
              }""")
              metrics['five_photo_usable_ms'] = usable_ms
              print('BH-230 deployed fresh benchmark metrics:', json.dumps(metrics, sort_keys=True))
              fresh.close()

              # Restored Survey: preserve the validated Relevé -> Maison transition.
              restored = browser.new_context(viewport={'width': 390, 'height': 844})
              restored_page = restored.new_page()
              restored_errors = []
              restored_page.on('pageerror', lambda error: restored_errors.append(f'pageerror: {error}'))
              restored_page.add_init_script(init_script)
              restored_url = urljoin(
                  base if base.endswith('/') else base + '/',
                  f'photo.html?checkpoint=bh230-restored&runtime-check={deploy_sha}',
              )
              response = restored_page.goto(restored_url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, f'photo.html HTTP failure: {response.status if response else "no response"}'
              restored_page.wait_for_selector('body.boldungo-shell-enabled', timeout=15000)
              restored_page.wait_for_function(
                  """() => document.querySelector('.boldungo-cockpit')?.dataset.shellState === 'scene'""",
                  timeout=15000,
              )
              assert restored_page.locator('#shell-state-title').text_content().strip() == '3. Maison'
              assert restored_page.locator('[data-shell-state="scene"]').get_attribute('aria-current') == 'page'
              assert restored_page.locator('#shell-primary-button').text_content().strip() == 'Créer le PDF Maison'
              assert 'Relevé validé' in restored_page.locator('#shell-scene-status').text_content()
              assert restored_page.locator('#shell-survey-next').count() == 0
              assert restored_page.locator('#download-scene-handoff').count() == 1
              assert not restored_errors, restored_errors
              restored.close()
              browser.close()

          print(f'deployed photo cockpit verification passed: {benchmark_url}')
          PY

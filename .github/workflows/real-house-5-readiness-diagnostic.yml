name: Real house 5 readiness diagnostic

on:
  push:
    branches:
      - diagnostic-real-house-5-readiness

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e './lego_geometry_engine[dev]'
      - name: Probe accepted Survey against current Scene candidate
        run: |
          python -m brickhouse.pipeline_probe \
            frontend/benchmarks/real-house-5/accepted-survey-v0.1.json \
            tests/fixtures/real_house_5_scene_candidate.json \
            > real-house-5-readiness.json
          cat real-house-5-readiness.json
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: real-house-5-readiness
          path: real-house-5-readiness.json
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/viewer.js
          node --check frontend/instructions.js
          node --check frontend/configurator.js
          node --check frontend/photo.js
          node --check frontend/photo-simple.js
          node --check frontend/brickhouse-single-package.js
          node --check frontend/external-bundle-import.js
          node --check frontend/survey-import.js
          node --check frontend/scene-survey-gate.js
          node --check frontend/scene-build.js

      - name: Run reference M0 pipeline
        run: >-
          brickhouse-m0
          docs/examples/building-model-simple-house.json
          /tmp/brickhouse-house-export.json
          --front-width-studs 48

      - name: Verify export exists
        run: test -s /tmp/brickhouse-house-export.json

      - name: Generate generic shed viewer reference
        run: >-
          brickhouse-m0
          docs/examples/building-model-shed-house.json
          /tmp/brickhouse-shed-viewer-export.json
          --front-width-studs 48

      - name: Verify shed viewer reference
        run: |
          test -s /tmp/brickhouse-shed-viewer-export.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/brickhouse-shed-viewer-export.json').read_text())
          parts = data['brick_model']['parts']
          assert any(part.get('roof_side') == 'slope' for part in parts)
          assert not any(part.get('category') == 'ridge_tile' for part in parts)
          assert any(part['placement_id'].startswith('shed-wall-') for part in parts)
          assert data['bom']['total_parts'] == len(parts)
          PY

      - name: Upload shed viewer reference
        uses: actions/upload-artifact@v4
        with:
          name: brickhouse-shed-viewer-export
          path: /tmp/brickhouse-shed-viewer-export.json
          if-no-files-found: error
          retention-days: 14

      - name: Run rich ArchitecturalScene pipeline smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brickhouse.pipeline import run_m0_pipeline_scene
          from brickhouse.scene import ArchitecturalScene

          path = Path('docs/examples/architectural-scene-rich-exterior.json')
          scene = ArchitecturalScene.model_validate_json(path.read_text(encoding='utf-8'))
          bundle = run_m0_pipeline_scene(scene, front_width_studs=48)
          ids = [part.placement_id for part in bundle.brick_model.parts]
          assert any(value.startswith('scene-platform:deck:') for value in ids)
          assert any(value.startswith('scene-stair:deck_stair:') for value in ids)
          assert any(value.startswith('scene-terrain:right:') for value in ids)
          assert bundle.bom.total_parts == len(bundle.brick_model.parts)
          output = Path('/tmp/brickhouse-rich-scene-export.json')
          output.write_text(json.dumps(bundle.model_dump(mode='json'), indent=2), encoding='utf-8')
          PY

      - name: Verify rich Scene export exists
        run: test -s /tmp/brickhouse-rich-scene-export.json

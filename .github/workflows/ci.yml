name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run reference M0 pipeline
        run: >-
          brickhouse-m0
          docs/examples/building-model-simple-house.json
          /tmp/brickhouse-house-export.json
          --front-width-studs 48

      - name: Verify export exists
        run: test -s /tmp/brickhouse-house-export.json

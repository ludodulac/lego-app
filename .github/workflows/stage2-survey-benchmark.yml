name: Stage 2 Survey benchmark PDF

on:
  push:
    branches: [benchmark-pane-count-stage2]
    paths:
      - '.github/workflows/stage2-survey-benchmark.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Start Boldungo static frontend
        run: |
          python -m http.server 8000 -d frontend >/tmp/boldungo-stage2-http.log 2>&1 &
          echo $! >/tmp/boldungo-stage2-http.pid

      - name: Generate real-house Survey handoff through the product path
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from playwright.sync_api import sync_playwright

          output = Path('/tmp/BRICKHOUSE-SURVEY-pdf-handoff-0.10.pdf')
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the runner')

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=browser_path,
                  args=['--no-sandbox'],
              )
              page = browser.new_page(viewport={'width': 1280, 'height': 900})
              runtime_errors = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))

              response = page.goto(
                  'http://127.0.0.1:8000/photo.html?benchmark=real-house-5',
                  wait_until='domcontentloaded',
                  timeout=30000,
              )
              assert response and response.ok, f'photo.html HTTP failure: {response.status if response else "no response"}'

              page.wait_for_function(
                  "document.querySelector('#ai-package-status')?.textContent.includes('5 photos originales')",
                  timeout=15000,
              )
              photo_count = page.evaluate(
                  "() => [...document.querySelectorAll('.guided-photo-input')].reduce((n, input) => n + input.files.length, 0)"
              )
              assert photo_count == 5, f'expected 5 preloaded photos, got {photo_count}'

              mapping = page.evaluate("""() => {
                  const slots = ['front', 'right', 'left', 'rear'];
                  const out = [];
                  for (const slot of slots) {
                    const input = document.querySelector(`.guided-photo-slot[data-slot="${slot}"] .guided-photo-input`);
                    for (const file of (input?.files || [])) out.push([slot, file.name]);
                  }
                  return out;
              }""")
              expected = [
                  ['front', '01-original.jpg'],
                  ['right', '02-original.jpg'],
                  ['left', '03-original.jpg'],
                  ['left', '04-original.jpg'],
                  ['rear', '05-original.jpg'],
              ]
              assert mapping == expected, f'unexpected benchmark order/mapping: {mapping}'

              page.locator('[data-shell-state="survey"]').click(timeout=5000)
              with page.expect_download(timeout=60000) as download_info:
                  page.locator('#download-ai-package').click(timeout=10000)
              download = download_info.value
              download.save_as(str(output))
              assert output.exists() and output.stat().st_size > 100000, f'PDF too small: {output.stat().st_size if output.exists() else 0}'

              raw = output.read_bytes()
              for token in (b'pane_count', b'leaf_count'):
                  assert token in raw, f'missing opening-semantics token in PDF: {token!r}'
              positions = [raw.find(name.encode('ascii')) for name in [
                  '01-original.jpg', '02-original.jpg', '03-original.jpg', '04-original.jpg', '05-original.jpg'
              ]]
              assert all(pos >= 0 for pos in positions), f'missing photo filename in PDF: {positions}'
              assert positions == sorted(positions), f'photo order not preserved in PDF: {positions}'
              assert not runtime_errors, runtime_errors
              browser.close()

          print(f'generated {output} ({output.stat().st_size} bytes)')
          PY

      - name: Upload Stage 2 handoff PDF
        uses: actions/upload-artifact@v4
        with:
          name: stage2-survey-handoff
          path: /tmp/BRICKHOUSE-SURVEY-pdf-handoff-0.10.pdf
          if-no-files-found: error
          retention-days: 7

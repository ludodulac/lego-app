name: Verify raw external Scene v4.8
on:
  push:
    branches: [verify-external-scene-v48]
    paths: ['.github/workflows/verify-external-scene-v48.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Materialize exact raw producer JSON and accepted Survey
        run: |
          cat > /tmp/scene.json.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/scene.json.gz.b64 | gzip -d > /tmp/brickhouse-scene-result.json
          echo '833918375fa1303b164e229992f05552d646be768f087427d7f5f65227aa526c  /tmp/brickhouse-scene-result.json' | sha256sum -c -
          git fetch origin stage2-real-survey-to-scene
          : > /tmp/brickhouse-survey-result.json
          for n in 1 2 3 4 5; do git show origin/stage2-real-survey-to-scene:frontend/benchmarks/real-house-5/accepted-survey-real-v0.1.part${n} >> /tmp/brickhouse-survey-result.json; done
      - name: Parse Pydantic then gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from brickhouse.survey import ArchitecturalSurvey
          from brickhouse.scene import ArchitecturalScene, validate_scene_against_survey, project_scene_to_building
          scene_path=Path('/tmp/brickhouse-scene-result.json')
          survey_path=Path('/tmp/brickhouse-survey-result.json')
          scene=ArchitecturalScene.model_validate_json(scene_path.read_text())
          print('PYDANTIC_ARCHITECTURAL_SCENE=PASS')
          survey=ArchitecturalSurvey.model_validate_json(survey_path.read_text())
          issues=list(validate_scene_against_survey(survey, scene))
          errors=[i for i in issues if getattr(i.severity,'value',i.severity)=='error']
          print('GATE_ERROR_COUNT='+str(len(errors)))
          for i in issues:
              print('GATE_ISSUE', getattr(i.severity,'value',i.severity), i.code, i.object_id, i.message)
          print('GATE_SURVEY_SCENE=' + ('PASS' if not errors else 'FAIL'))
          proj=project_scene_to_building(scene)
          blockers=[i for i in proj.issues if getattr(i.severity,'value',i.severity)=='blocker']
          print('PROJECTION_BLOCKER_COUNT='+str(len(blockers)))
          for i in blockers: print('PROJECTION_BLOCKER', i.code, i.object_id)
          targets=['obs-front-opening-top-left','obs-front-opening-top-right','obs-front-opening-middle-left','obs-front-opening-middle-right']
          by={o.id:o for o in scene.openings}
          print('PANE_COUNTS', {x:(by[x].opening_visual.pane_count if by[x].opening_visual else None) for x in targets})
          print('LOWER_TYPES', by['obs-front-opening-lower-left'].type, by['obs-front-opening-lower-right'].type)
          print('DEFERRED', [(d.survey_id,getattr(d.kind,'value',d.kind)) for d in scene.deferred_entities])
          print('RELATIONS', [(r.id,r.subject_id,r.object_id,getattr(r.geometry_status,'value',r.geometry_status),r.semantic_anchor_volume_id) for r in scene.relations])
          raise SystemExit(0 if not errors else 2)
          PY
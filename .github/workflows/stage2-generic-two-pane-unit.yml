name: Stage 2 generic two-pane unit

on:
  push:
    branches: [stage2-real-survey-to-scene]
    paths:
      - '.github/workflows/stage2-generic-two-pane-unit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/bricks/test_generic_two_pane_representation.py tests/scene/test_opening_pane_count_fidelity.py tests/scene/test_survey_scene_pane_contract.py

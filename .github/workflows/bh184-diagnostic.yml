name: BH-184 diagnostic

on:
  push:
    branches:
      - bh-184-export-capability-summary

jobs:
  isolate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bricks
            command: pytest -q tests/bricks
          - name: building-geometry
            command: pytest -q tests/building tests/geometry
          - name: pipeline-scene-survey
            command: pytest -q tests/pipeline tests/scene tests/survey
          - name: root-tests
            command: pytest -q tests/*.py
          - name: bricks-plus-building-geometry
            command: pytest -q tests/bricks tests/building tests/geometry
          - name: bricks-plus-pipeline-scene-survey
            command: pytest -q tests/bricks tests/pipeline tests/scene tests/survey
          - name: bricks-plus-root-tests
            command: pytest -q tests/bricks tests/*.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e './lego_geometry_engine[dev]'
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

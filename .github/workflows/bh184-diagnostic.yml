name: BH-184 diagnostic

on:
  push:
    branches:
      - bh-184-export-capability-summary

jobs:
  isolate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bh184-file
            command: pytest -q tests/bricks/test_bh184_export_capabilities.py
          - name: legacy-export-file
            command: pytest -q tests/bricks/test_export.py
          - name: legacy-then-bh184
            command: pytest -q tests/bricks/test_export.py tests/bricks/test_bh184_export_capabilities.py
          - name: bh184-then-legacy
            command: pytest -q tests/bricks/test_bh184_export_capabilities.py tests/bricks/test_export.py
          - name: all-bricks
            command: pytest -q tests/bricks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e './lego_geometry_engine[dev]'
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

name: BH-184 diagnostic

on:
  push:
    branches:
      - bh-184-export-capability-summary

jobs:
  full-suite-junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e './lego_geometry_engine[dev]'
      - name: Run full pytest and capture JUnit
        run: |
          set +e
          pytest -q tests --maxfail=1 --tb=short --junitxml=bh184-junit.xml
          status=$?
          echo "$status" > bh184-pytest-status.txt
          exit 0
      - name: Upload diagnostic JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bh184-junit
          path: |
            bh184-junit.xml
            bh184-pytest-status.txt
          if-no-files-found: error

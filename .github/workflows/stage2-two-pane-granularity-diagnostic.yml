name: Stage 2 real window catalog audit

on:
  push:
    branches: [stage2-two-pane-visual-refinement]
    paths:
      - '.github/workflows/stage2-two-pane-granularity-diagnostic.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Audit real window catalog
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from brickhouse.bricks.windows import VALIDATED_WINDOW_ASSEMBLIES
          from brickhouse.bricks.opening_motifs import OPENING_MOTIFS
          from brickhouse.bricks.piece_capabilities import create_current_engine_capability_registry

          with open('data/processed/piece_types_master.csv',encoding='utf-8',newline='') as handle:
              rows=list(csv.DictReader(handle))
          window_rows=[r for r in rows if 'window' in (r.get('name') or '').lower() or 'window' in (r.get('category') or '').lower() or 'glass' in (r.get('name') or '').lower()]
          registry=create_current_engine_capability_registry()
          by_id={p.engine_id:p for p in registry.pieces}
          validated_ids={x for a in VALIDATED_WINDOW_ASSEMBLIES for x in (a.frame_part_id,a.pane_part_id)}
          report={
              'master_window_rows':window_rows,
              'validated_assemblies':[a.__dict__ for a in VALIDATED_WINDOW_ASSEMBLIES],
              'validated_parts':[by_id[x].model_dump(mode='json') for x in sorted(validated_ids)],
              'opening_motifs':[m.model_dump(mode='json') for m in OPENING_MOTIFS if m.representation_role=='window'],
          }
          print(json.dumps(report,indent=2,ensure_ascii=False))
          Path('/tmp/window-catalog-audit.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          assert len(VALIDATED_WINDOW_ASSEMBLIES)==3
          assert all(by_id[x].auto_placeable for x in validated_ids)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-window-catalog-audit
          path: /tmp/window-catalog-audit.json
          retention-days: 7

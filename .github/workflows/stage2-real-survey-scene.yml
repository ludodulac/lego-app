name: Stage 2 real Survey to Scene handoff

on:
  push:
    branches: [stage2-real-survey-to-scene]
    paths:
      - '.github/workflows/stage2-real-survey-scene.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 2 branch
        uses: actions/checkout@v4

      - name: Verify exact real Survey checkpoint bytes
        run: |
          cat frontend/benchmarks/real-house-5/accepted-survey-real-v0.1.part{1,2,3,4,5} > /tmp/brickhouse-survey-result.json
          echo 'b28e327125dc64c1548e1b5c75d3cc93e46d0e298fa62c19279fc1096cce50ef  /tmp/brickhouse-survey-result.json' | sha256sum -c -
          python - <<'PY'
          import json
          p='/tmp/brickhouse-survey-result.json'
          survey=json.load(open(p, encoding='utf-8'))
          ids=['obs-front-opening-top-left','obs-front-opening-top-right','obs-front-opening-middle-left','obs-front-opening-middle-right']
          by_id={o['id']:o for o in survey['observations']}
          for oid in ids:
              opening=by_id[oid]
              assert opening.get('opening_visual',{}).get('pane_count') == 2, oid
              assert 'leaf_count' not in opening.get('opening_visual',{}), oid
              assert 'window_style' not in opening, oid
          print('real Survey checkpoint verified')
          PY

      - name: Verify generic Scene pane contract and serialization
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/scene/test_survey_scene_pane_contract.py

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Start Boldungo static frontend
        run: |
          python -m http.server 8000 -d frontend >/tmp/boldungo-stage2-scene-http.log 2>&1 &
          echo $! >/tmp/boldungo-stage2-scene-http.pid

      - name: Generate Survey to Scene handoff through product path
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          from playwright.sync_api import sync_playwright

          output = Path('/tmp/BRICKHOUSE-SURVEY-TO-SCENE-pdf-handoff-0.2.pdf')
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the runner')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=browser_path, args=['--no-sandbox'])
              page = browser.new_page(viewport={'width': 1280, 'height': 900})
              runtime_errors = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))
              response = page.goto(
                  'http://127.0.0.1:8000/scene.html?benchmark=real-house-5&stage=scene',
                  wait_until='domcontentloaded', timeout=30000,
              )
              assert response and response.ok, f'scene.html HTTP failure: {response.status if response else "no response"}'
              page.wait_for_function(
                  "document.querySelector('#ai-package-status')?.textContent.includes('Survey réel accepté chargé')",
                  timeout=15000,
              )
              photo_count = page.evaluate(
                  "() => [...document.querySelectorAll('.guided-photo-input')].reduce((n,input)=>n+input.files.length,0)"
              )
              assert photo_count == 5, f'expected 5 photos, got {photo_count}'

              payload = page.evaluate("() => JSON.parse(localStorage.getItem('brickhouse.pendingArchitecturalSurvey'))")
              assert payload['source'] == 'accepted_real_survey_checkpoint_stage2'
              by_id = {o['id']: o for o in payload['survey']['observations']}
              for oid in ['obs-front-opening-top-left','obs-front-opening-top-right','obs-front-opening-middle-left','obs-front-opening-middle-right']:
                  opening = by_id[oid]
                  assert opening.get('opening_visual',{}).get('pane_count') == 2, oid
                  assert 'leaf_count' not in opening.get('opening_visual',{}), oid
                  assert 'window_style' not in opening, oid

              with page.expect_download(timeout=60000) as download_info:
                  page.locator('#download-scene-handoff').click(timeout=10000)
              download = download_info.value
              download.save_as(str(output))
              assert output.exists() and output.stat().st_size > 100000, output.stat().st_size if output.exists() else 0
              raw = output.read_bytes()
              for token in (
                  b'pane_count',
                  b'obs-front-opening-top-left',
                  b'obs-front-opening-middle-right',
                  b'SCENEOPENING OBSERVABLE TOPOLOGY',
                  b'MUST preserve that exact observed integer',
              ):
                  assert token in raw, f'missing corrected contract/Survey token in handoff PDF: {token!r}'
              assert not runtime_errors, runtime_errors
              browser.close()

          print(f'generated {output} ({output.stat().st_size} bytes)')
          PY

      - name: Upload Survey to Scene handoff PDF
        uses: actions/upload-artifact@v4
        with:
          name: stage2-real-survey-to-scene-handoff
          path: /tmp/BRICKHOUSE-SURVEY-TO-SCENE-pdf-handoff-0.2.pdf
          if-no-files-found: error
          retention-days: 7
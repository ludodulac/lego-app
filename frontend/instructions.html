<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrickHouse — Notice de montage</title>
  <link rel="stylesheet" href="./instructions.css" />
</head>
<body>
  <header class="toolbar no-print">
    <a href="./viewer.html">← Maquette 3D</a>
    <a href="./index.html">Accueil</a>
    <label class="button" for="instruction-file">Ouvrir un export JSON</label>
    <input id="instruction-file" type="file" accept="application/json,.json" />
    <button id="load-instruction-sample" type="button">Charger l’exemple</button>
    <button id="print-instructions" type="button">Imprimer / Enregistrer en PDF</button>
    <button id="download-bom" type="button">Télécharger la liste des pièces</button>
  </header>

  <main id="document" class="document">
    <section class="cover">
      <p class="eyebrow">BrickHouse</p>
      <h1>Notice de montage</h1>
      <p id="instruction-subtitle">Chargement…</p>
      <dl id="instruction-summary"></dl>
    </section>
    <p id="instruction-message" class="message"></p>
    <section id="steps" class="steps"></section>
  </main>

  <script>
    // Keep the manual and viewer on the same generated project without a backend session.
    const brickHouseOriginalFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const target = typeof input === 'string' ? input : input?.url || '';
      if (target.endsWith('sample-export.json')) {
        const current = localStorage.getItem('brickhouse.currentExport');
        if (current) return Promise.resolve(new Response(current, { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      return brickHouseOriginalFetch(input, init);
    };
  </script>
  <script type="module" src="./instructions.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrickHouse — Configurateur</title>
  <link rel="stylesheet" href="./configurator.css" />
</head>
<body>
  <header class="topbar"><a href="./index.html">← Viewer 3D</a><strong>BrickHouse</strong><span>Configurateur M0</span></header>
  <main class="layout">
    <section class="panel">
      <p class="eyebrow">Avant l’analyse photo</p>
      <h1>Décrire une maison</h1>
      <p class="intro">Ce formulaire produit le même <code>BuildingModel</code> que l’IA devra générer plus tard à partir des photos.</p>
      <form id="building-form">
        <div class="field wide"><label for="name">Nom du projet</label><input id="name" value="Ma maison" required /></div>
        <div class="field"><label for="width">Largeur façade (m)</label><input id="width" type="number" min="3" max="60" step="0.1" value="10" required /></div>
        <div class="field"><label for="depth">Profondeur (m)</label><input id="depth" type="number" min="3" max="60" step="0.1" value="8" required /></div>
        <div class="field"><label for="height">Hauteur murs (m)</label><input id="height" type="number" min="2.4" max="12" step="0.1" value="5.6" required /></div>
        <div class="field"><label for="floors">Étages</label><select id="floors"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div>
        <div class="field"><label for="pitch">Pente du toit</label><input id="pitch" type="number" min="10" max="70" step="1" value="35" required /></div>
        <div class="field"><label for="ridge">Direction du faîtage</label><select id="ridge"><option value="depth" selected>Profondeur</option><option value="width">Largeur</option></select></div>
        <div class="field"><label for="ground-windows">Fenêtres façade RDC</label><select id="ground-windows"><option>0</option><option selected>2</option><option>4</option></select></div>
        <div class="field"><label for="upper-windows">Fenêtres façade étage</label><select id="upper-windows"><option>0</option><option selected>2</option><option>4</option></select></div>
        <label class="check wide"><input id="door" type="checkbox" checked /> Porte d’entrée centrée</label>
        <div class="field"><label for="studs">Largeur maquette (tenons)</label><input id="studs" type="number" min="16" max="160" step="2" value="48" required /></div>
        <div class="field"><label for="api-url">URL API moteur (optionnel)</label><input id="api-url" type="url" placeholder="https://api.brickhouse..." /></div>
        <div class="actions wide"><button type="submit" class="primary">Générer le BuildingModel</button><button id="download-model" type="button" disabled>Télécharger JSON</button><button id="build-bricks" type="button" disabled>Construire en briques</button></div>
      </form>
      <p id="status" class="status"></p>
    </section>
    <section class="preview-panel"><div class="preview-head"><div><p class="eyebrow">Contrat moteur</p><h2>BuildingModel v0.1</h2></div><span id="validity">En attente</span></div><pre id="json-preview">Remplissez le formulaire puis cliquez sur « Générer ».</pre></section>
  </main>
  <script type="module" src="./configurator.js"></script>
</body>
</html>

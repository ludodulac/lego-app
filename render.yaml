services:
  - type: web
    name: brickhouse-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn brickhouse.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5
      - key: BRICKHOUSE_CORS_ORIGINS
        value: https://ludodulac.github.io
